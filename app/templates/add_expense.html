<!DOCTYPE html>
<html>
  <head>
    <title>Add Expense - Personal Expense Tracker</title>
  </head>
  <body>
    <h1>Add Expense</h1>

    <!-- Simple navigation -->
    <nav>
      <a href="{{ url_for('main.dashboard') }}">Dashboard</a> |
      <a href="{{ url_for('main.add_expense') }}">Add Expense</a> |
      <a href="{{ url_for('main.view_history') }}">View History</a> |
      <a href="{{ url_for('main.logout') }}">Logout</a>

    </nav>

    <hr>

    <!-- Flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul>
          {% for category, message in messages %}
            <li>{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form method="post" action="{{ url_for('main.add_expense') }}">
      <div>
        <label>Amount:</label>
        <input type="number" step="0.01" name="amount" required>
      </div>

      <div>
        <label>Date:</label>
        <input type="date" name="expense_date" required>
      </div>

      <div>
        <label>Category:</label>
        <select name="category_id" required>
          <option value="">-- Select Category --</option>
          {% for cat in categories %}
            <option value="{{ cat['category_id'] }}">{{ cat['category_name'] }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label>Description:</label>
        <textarea name="description" rows="3"></textarea>
      </div>

      <button type="submit">Save Expense</button>
    </form>

    <p>
      <a href="{{ url_for('main.dashboard') }}">Back to Dashboard</a>
    </p>

  </body>
</html>
